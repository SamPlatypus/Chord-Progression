<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="description" content="Offline chord-progression player for songwriting practice: keys & modes, presets, strum and arpeggio patterns, looping, tempo trainer." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Chord Loop</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('cp.settings.v1') || '{}');
        var t = s.theme || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="./assets/index-DR-WmLeq.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DvobDZCm.css">
  </head>

    <div id="root"></div>
    <noscript>Chord Loop needs JavaScript to make music.</noscript>
  </body>
</html>
